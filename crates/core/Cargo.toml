[package]
name = "ganban-core"
version = "1.0.9"
license = "AGPL-3.0-only"
edition = "2021"
description = "Shared data layer and business logic for Ganban (desktop app + daemon)"

[lib]
name = "ganban_core"

[dev-dependencies]
rust_xlsxwriter = { version = "0.102", default-features = false }
tokio = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# task_local! for the domain-event suppression scope (sync merge + rule actions).
tokio = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
calamine = "0.38"
encoding_rs = "0.8"
# Only to read an XLSX's declared unpacked size before calamine opens it (calamine's own zip).
zip = { version = "9", default-features = false }
