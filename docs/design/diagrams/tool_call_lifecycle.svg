<svg width="680" viewBox="0 0 680 630" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tool call lifecycle through the write gate</title>
<desc>A tool call flows from the model through registry validation, then branches: read-class calls auto-execute and loop back to the model with capped rounds; write-class calls become proposals that a human approves into the ledger or rejects into nothing.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  rect { stroke-width: 1; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .cap { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="teal"><rect x="230" y="40" width="220" height="44" rx="8"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Model emits a tool call</text></g>

<line x1="340" y1="84" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="215" y="124" width="250" height="56" rx="8"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Tool registry</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Validate args, enforce scope</text></g>

<path d="M280 180 L280 210 L170 210 L170 238" class="arr" marker-end="url(#arrow)"/>
<path d="M400 180 L400 210 L510 210 L510 238" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="60" y="240" width="220" height="56" rx="8"/><text class="th" x="170" y="260" text-anchor="middle" dominant-baseline="central">Read class</text><text class="ts" x="170" y="278" text-anchor="middle" dominant-baseline="central">Auto-executes via invoke</text></g>

<g class="amber"><rect x="400" y="240" width="220" height="56" rx="8"/><text class="th" x="510" y="260" text-anchor="middle" dominant-baseline="central">Write class</text><text class="ts" x="510" y="278" text-anchor="middle" dominant-baseline="central">Becomes a proposal</text></g>

<line x1="170" y1="296" x2="170" y2="334" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="296" x2="510" y2="334" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="60" y="336" width="220" height="56" rx="8"/><text class="th" x="170" y="356" text-anchor="middle" dominant-baseline="central">Result appended</text><text class="ts" x="170" y="374" text-anchor="middle" dominant-baseline="central">Re-called, rounds capped</text></g>

<g class="amber"><rect x="400" y="336" width="220" height="56" rx="8"/><text class="th" x="510" y="356" text-anchor="middle" dominant-baseline="central">Approved by a human</text><text class="ts" x="510" y="374" text-anchor="middle" dominant-baseline="central">Invoke executes, ledgered</text></g>

<path d="M620 268 L636 268 L636 460 L622 460" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="400" y="432" width="220" height="56" rx="8"/><text class="th" x="510" y="452" text-anchor="middle" dominant-baseline="central">Rejected</text><text class="ts" x="510" y="470" text-anchor="middle" dominant-baseline="central">Discarded, nothing changes</text></g>

<path d="M60 364 L44 364 L44 62 L228 62" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<line x1="170" y1="392" x2="170" y2="526" class="arr" marker-end="url(#arrow)"/>
<path d="M400 364 L340 364 L340 526" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="528" width="560" height="56" rx="8"/><text class="th" x="340" y="548" text-anchor="middle" dominant-baseline="central">Action ledger</text><text class="ts" x="340" y="566" text-anchor="middle" dominant-baseline="central">Every applied action, tokens, latency</text></g>

<text class="ts cap" x="340" y="612" text-anchor="middle">Dashed = the tool loop, capped rounds. Amber = a human is required. Rejection touches nothing.</text>
</svg>
