name: Linux shell

# The desktop shell (gansty) on Linux: a cargo check, and its own tests, with the system libraries
# release.yml's Linux build installs. Nobody can compile the Linux side on a Mac, so this is where a
# Linux-only error shows before a release does. It runs when src-tauri/ (or the lockfile) changed:
# on any branch's push, so a branch can check itself before it's merged, and on pull requests.

on:
  push:
    paths:
      - 'src-tauri/**'
      - 'Cargo.lock'
      - '.github/workflows/linux-shell.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'Cargo.lock'
      - '.github/workflows/linux-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gansty:
    # The release's Linux build machine.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build libraries (as release.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: linux-shell

      # Tauri's context macro and the embedded server read the built web UI (dist/). A check
      # needs only that it exists, so a stub stands in for the vite build.
      - name: Stub the web UI
        run: mkdir -p dist && echo '<!doctype html><title>Ganban</title>' > dist/index.html

      - name: Check the desktop shell
        run: cargo check -p gansty

      # system_open.rs's tests, on Linux: it runs the system's opener as the AppImage would. (Two
      # of the shell's other tests build a mock app, which stops at "Permission denied" on this
      # runner; they pass on a Mac.)
      - name: Test opening things on Linux
        run: cargo test -p gansty --lib system_open
