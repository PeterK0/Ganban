[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/tauri-plugin-apk-updater", "src-tauri"]

# Shared dependency versions for every workspace member. Individual crates opt
# in with `<dep>.workspace = true` so the SQLite/serde/chrono stack stays in
# lockstep between the desktop app, the headless daemon, and the shared core.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
sha2 = "0.10"
getrandom = "0.2"
ganban-core = { path = "crates/core" }
ganban-server = { path = "crates/server" }
